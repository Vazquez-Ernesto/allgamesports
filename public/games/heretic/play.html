<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heretic</title>
    <!-- Página mínima que carga Heretic dentro del reproductor (en un iframe). -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
        /* Mantiene la proporción del juego (4:3) con bandas negras. */
        object-fit: contain;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <script src="play.js"></script>
    <script src="heretic.js"></script>
  </body>
</html>
