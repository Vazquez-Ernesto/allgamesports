<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperTux</title>
    <!-- Página mínima que carga SuperTux dentro del reproductor (en un iframe).
         Primero la configuración (play.js), después los paquetes de datos y al
         final el motor. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* SuperTux dibuja al tamaño de la ventana: no hace falta escalar. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <script src="play.js"></script>
    <script src="data/resto.js"></script>
    <script src="data/imagenes-1.js"></script>
    <script src="data/imagenes-2.js"></script>
    <script src="data/musica.js"></script>
    <script src="supertux2.js"></script>
  </body>
</html>
