<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScummVM</title>
    <!-- Página mínima que carga ScummVM dentro del reproductor (en un iframe).
         Los argumentos van en el #: play.html#--path=/data/games/sky sky -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* Sin borde ni padding: si no, las coordenadas del mouse se corren. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <script src="play.js"></script>
    <script src="scummvm.js"></script>
  </body>
</html>
