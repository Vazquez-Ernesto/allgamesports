<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" shape-rendering="crispEdges">
  <!-- Portada generada (no es arte oficial): los datos de DOOM los aporta el jugador. -->
  <defs>
    <pattern id="rayas" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="28" height="28" fill="#17150d" />
      <rect width="14" height="28" fill="#1d1a10" />
    </pattern>
  </defs>
  <rect width="320" height="200" fill="url(#rayas)" />
  <rect x="1" y="1" width="318" height="198" fill="none" stroke="#ffb238" stroke-opacity="0.35" stroke-width="2" />

  <!-- Disquete: el archivo de datos que trae el jugador -->
  <g transform="translate(124 22)">
    <path d="M0 0h60l12 12v60H0z" fill="#ffb238" />
    <rect x="14" y="0" width="34" height="24" fill="#17150d" />
    <rect x="36" y="4" width="8" height="16" fill="#ffb238" />
    <rect x="10" y="38" width="52" height="34" fill="#f3e9cf" />
    <rect x="16" y="46" width="40" height="4" fill="#17150d" />
    <rect x="16" y="56" width="40" height="4" fill="#17150d" />
  </g>

  <text x="160" y="142" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" font-weight="700" letter-spacing="6" fill="#ffb238">DOOM</text>
  <text x="160" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#e9ecdf">CON TU COPIA DEL JUEGO</text>
</svg>
